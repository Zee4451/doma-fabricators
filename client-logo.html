    <!-- BEGIN: Marquee Logic -->
    <script data-purpose="marquee-animation">
        document.addEventListener('DOMContentLoaded', () => {
            const track = document.getElementById('marquee-track');

            // Calculate half width for looping
            // We duplicated the list once, so we move until half of the track's scrollWidth
            const loopWidth = track.scrollWidth / 2;

            const animation = gsap.to(track, {
                x: -loopWidth,
                duration: 30, // Adjust for speed
                ease: "none",
                repeat: -1,
                onReverseComplete: () => {
                    gsap.set(track, { x: 0 });
                }
            });

            // Pause on hover
            track.addEventListener('mouseenter', () => animation.pause());
            track.addEventListener('mouseleave', () => animation.play());
        });
    </script>
